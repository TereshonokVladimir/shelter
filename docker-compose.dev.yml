# Dev stack with hot reload. Code is bind-mounted — save a file, refresh the page.
# Usage: docker compose -f docker-compose.dev.yml up
# Or:    npm run docker:dev

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: file:/app/data/dev.db
      JWT_SECRET: ${JWT_SECRET:-last-shelter-docker-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CHOKIDAR_USEPOLLING: 'true'
      ENABLE_MOCK_BOTS: ${ENABLE_MOCK_BOTS:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-me}
    volumes:
      - ./api:/app
      - api_dev_node_modules:/app/node_modules
      - api-data:/app/data
    command: >
      sh -c "npx prisma generate
      && npx prisma migrate deploy
      && npx prisma db seed
      && npm run start:dev"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - web_dev_node_modules:/app/node_modules
      - web_dev_next:/app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  api_dev_node_modules:
  web_dev_node_modules:
  web_dev_next:
